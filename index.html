<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
      <h1 id="main-title">Welcome to My Flower Gallery</h1>
  <p class="description">Click the button to change the gallery style!</p>
  <button id="changeStyleBtn">Change Style</button>

  <div class="gallery">
    <img src="https://www.colorblends.com/wp-content/uploads/2020/01/1411_FrenchBlendRose_PEH1359sq-1024x1024.jpg" alt="Flower 1"width="200" />
    <img src="https://www.ecusltd.co.uk/wp-content/uploads/2024/06/cherry-blossom-aspect-ratio-1200-900.webp" alt="Flower 2"width="200" />
    <img src="https://www.peachtreepetals.com/cdn/shop/articles/all_about_sunflowers.jpg?crop=center&height=1200&v=1631036676&width=1200" alt="Flower 3"width="200" />
  </div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
     
$("h1").css("font-size", "36px");
$(".description").css("color", "rgb(51, 51, 51)");
$("#changeStyleBtn").css("padding", "10px");

/
$("img").mouseover(function () {
  $(this).addClass("highlight");
});
$("img").mouseout(function () {
  $(this).removeClass("highlight");
});
$("#changeStyleBtn").click(function () {
  $("body").css("background-color", "rgb(255, 228, 225)");
});


$("#main-title").click(function () {
  $(this).addClass("highlight");
});

    </script>
  </body>
</html>
